services:
  stremio-filtered:
    image: stremio-addon
    container_name: stremio-filtered
    restart: unless-stopped
    env_file: .env
    environment:
      - TMDB_KEY=${TMDB_KEY}
      - MDBLIST_KEY=${MDBLIST_KEY}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - MDBLIST_KEYS=${MDBLIST_KEYS:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - FANART_KEY=${FANART_KEY:-}
      - OMDB_KEY=${OMDB_KEY:-}
      - GOOGLE_AI_KEY=${GOOGLE_AI_KEY:-}
      - RPDB_KEY=${RPDB_KEY:-}
      - TP_KEY=${TP_KEY:-}
      - AIOSTREAMS_TEMPLATE_URL=${AIOSTREAMS_TEMPLATE_URL:-https://templates.peden88.stream/complete.json}
      - AIOSTREAMS_TEMPLATE_ID=${AIOSTREAMS_TEMPLATE_ID:-tamtaro.complete}
      - AIOSTREAMS_BASE_URL=${AIOSTREAMS_BASE_URL:-}
      - AIOMETADATA_BASE_URL=${AIOMETADATA_BASE_URL:-}
      - AIOMETADATA_ADDON_PASSWORD=${AIOMETADATA_ADDON_PASSWORD:-}
      - ULTRAMAX_ENCRYPTION_KEY=${ULTRAMAX_ENCRYPTION_KEY:-}
      - ULTRAMAX_SERVICES_MASTER_KEY=${ULTRAMAX_SERVICES_MASTER_KEY:-}
      - FILTER_MODE=on
      - PORT=7000
    ports:
      - "7000:7000"
    volumes:
      - ./index.js:/app/index.js
      - ./logo.svg:/app/logo.svg
      - ./configure.html:/app/configure.html
      - ./configs.json:/app/configs.json
      - /home/ubuntu/images:/app/images
    networks:
      - npm_default

  stremio-all:
    image: stremio-addon
    container_name: stremio-all
    restart: unless-stopped
    env_file: .env
    environment:
      - TMDB_KEY=${TMDB_KEY}
      - MDBLIST_KEY=${MDBLIST_KEY}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - MDBLIST_KEYS=${MDBLIST_KEYS:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - FANART_KEY=${FANART_KEY:-}
      - OMDB_KEY=${OMDB_KEY:-}
      - GOOGLE_AI_KEY=${GOOGLE_AI_KEY:-}
      - RPDB_KEY=${RPDB_KEY:-}
      - TP_KEY=${TP_KEY:-}
      - AIOSTREAMS_TEMPLATE_URL=${AIOSTREAMS_TEMPLATE_URL:-https://templates.peden88.stream/complete.json}
      - AIOSTREAMS_TEMPLATE_ID=${AIOSTREAMS_TEMPLATE_ID:-tamtaro.complete}
      - AIOSTREAMS_BASE_URL=${AIOSTREAMS_BASE_URL:-}
      - AIOMETADATA_BASE_URL=${AIOMETADATA_BASE_URL:-}
      - AIOMETADATA_ADDON_PASSWORD=${AIOMETADATA_ADDON_PASSWORD:-}
      - ULTRAMAX_ENCRYPTION_KEY=${ULTRAMAX_ENCRYPTION_KEY:-}
      - ULTRAMAX_SERVICES_MASTER_KEY=${ULTRAMAX_SERVICES_MASTER_KEY:-}
      - FILTER_MODE=off
      - PORT=7000
    ports:
      - "7001:7000"
    volumes:
      - ./index.js:/app/index.js
      - ./logo.svg:/app/logo.svg
      - ./configure.html:/app/configure.html
      - ./configs.json:/app/configs.json
      - /home/ubuntu/images:/app/images
    networks:
      - npm_default

  stremio-dev:
    image: stremio-addon
    container_name: stremio-dev
    restart: unless-stopped
    env_file: .env
    environment:
      - TMDB_KEY=${TMDB_KEY}
      - MDBLIST_KEY=${MDBLIST_KEY}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - MDBLIST_KEYS=${MDBLIST_KEYS:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - FANART_KEY=${FANART_KEY:-}
      - OMDB_KEY=${OMDB_KEY:-}
      - GOOGLE_AI_KEY=${GOOGLE_AI_KEY:-}
      - RPDB_KEY=${RPDB_KEY:-}
      - TP_KEY=${TP_KEY:-}
      - AIOSTREAMS_TEMPLATE_URL=${AIOSTREAMS_TEMPLATE_URL:-https://templates.peden88.stream/complete.json}
      - AIOSTREAMS_TEMPLATE_ID=${AIOSTREAMS_TEMPLATE_ID:-tamtaro.complete}
      - AIOSTREAMS_BASE_URL=${AIOSTREAMS_BASE_URL:-}
      - AIOMETADATA_BASE_URL=${AIOMETADATA_BASE_URL:-}
      - AIOMETADATA_ADDON_PASSWORD=${AIOMETADATA_ADDON_PASSWORD:-}
      - ULTRAMAX_ENCRYPTION_KEY=${ULTRAMAX_ENCRYPTION_KEY:-}
      - ULTRAMAX_SERVICES_MASTER_KEY=${ULTRAMAX_SERVICES_MASTER_KEY:-}
      - FILTER_MODE=on
      - PORT=7000
    ports:
      - "7003:7000"
    volumes:
      - ./index-dev.js:/app/index.js
      - ./configure-dev.html:/app/configure.html
      - ./logo.svg:/app/logo.svg
      - /home/ubuntu/images:/app/images
      - ./collections-builder.html:/app/collections-builder.html
      - ./configs.json:/app/configs.json
    networks:
      - npm_default

networks:
  npm_default:
    external: true
